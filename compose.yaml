name: incidentops-days12
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_ops
      POSTGRES_USER: incident_ops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.ps1}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_ops -d incident_ops"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incident_ops
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.ps1}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Run scripts/setup-local.ps1}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
