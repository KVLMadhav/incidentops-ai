    url: jdbc:h2:mem:incident_ops_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
app:
  jwt:
    # Fixed test-only signing key, never used by the runtime configuration.
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  bootstrap:
    enabled: false
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
